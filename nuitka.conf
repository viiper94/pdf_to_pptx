#windows
nuitka --standalone --onefile --mingw64 --enable-plugin=pyside6 --include-data-dir=assets=assets --include-data-dir=i18n=i18n --output-dir=nuitka_build --remove-output --jobs=6 --windows-console-mode=disable --windows-icon-from-ico=assets/app.ico pdf_to_pptx.py

#osx
nuitka \
  --mode=app \
  --enable-plugin=pyside6 \
  --include-data-dir=assets=assets \
  --include-data-dir=i18n=i18n \
  --output-dir=nuitka_build \
  --remove-output \
  --jobs=6 \
